services:
  postgres:
    image: postgres:16-alpine
    container_name: meuveiculo-db
    environment:
      POSTGRES_DB: meuveiculo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - meuveiculo_data:/var/lib/postgresql/data

volumes:
  meuveiculo_data: